name: Keep Render App Awake

on:
  schedule:
    # Runs every 5 minutes, well within Render's 15-minute sleep window
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows you to run it manually from the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render /api/health endpoint
        run: |
          # Set RENDER_APP_URL as a repo Actions variable, e.g. your-app.onrender.com
          response=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ vars.RENDER_APP_URL }}/api/health")
          echo "Health check status: $response"
          # A 200 OK response means the server is awake and healthy
          if [ "$response" != "200" ]; then
            echo "Health check failed"
            exit 1
          fi
